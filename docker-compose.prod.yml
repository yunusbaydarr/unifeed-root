name: unifeed-prod
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: "${POSTGRES_DB:?required}", POSTGRES_USER: "${POSTGRES_USER:?required}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?required}" }
    volumes: ["postgres-prod-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-prod-data:/data"]
  kafka-1: &kafka
    image: apache/kafka:3.9.1
    environment: &kafkaenv
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CLUSTER_ID: "${KAFKA_CLUSTER_ID:?required}"
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
    volumes: ["kafka-1-prod-data:/tmp/kraft-combined-logs"]
  kafka-2:
    <<: *kafka
    environment: { <<: *kafkaenv, KAFKA_NODE_ID: 2, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092 }
    volumes: ["kafka-2-prod-data:/tmp/kraft-combined-logs"]
  kafka-3:
    <<: *kafka
    environment: { <<: *kafkaenv, KAFKA_NODE_ID: 3, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092 }
    volumes: ["kafka-3-prod-data:/tmp/kraft-combined-logs"]
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on: [kafka-1, kafka-2, kafka-3]
    restart: "no"
    command: ["/bin/bash", "-ec", "until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --list; do sleep 5; done; for topic in email-events system-logs audit-logs; do /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic $$topic --partitions 3 --replication-factor 3; done"]
  backend:
    build: { context: ./unifeed-backend }
    environment: { SPRING_PROFILES_ACTIVE: prod, SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}", SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}", SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}", SPRING_DATA_REDIS_HOST: redis, SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka-1:9092,kafka-2:9092,kafka-3:9092", JWT_SIGNING_KEY: "${JWT_SIGNING_KEY}", GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}", GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}" }
    volumes: ["uploads-prod-data:/app/uploads"]
    depends_on: [postgres, redis, kafka-init]
  frontend:
    build: { context: ./unifeed-frontend }
    depends_on: [backend]
volumes: { postgres-prod-data: {}, redis-prod-data: {}, kafka-1-prod-data: {}, kafka-2-prod-data: {}, kafka-3-prod-data: {}, uploads-prod-data: {} }
