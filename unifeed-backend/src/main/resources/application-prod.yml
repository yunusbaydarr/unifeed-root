spring:
  application: { name: unifeed-backend }
  datasource: { url: "${SPRING_DATASOURCE_URL}", username: "${SPRING_DATASOURCE_USERNAME}", password: "${SPRING_DATASOURCE_PASSWORD}" }
  data: { redis: { host: "${SPRING_DATA_REDIS_HOST}", port: "${SPRING_DATA_REDIS_PORT:6379}" } }
  kafka:
    bootstrap-servers: "${SPRING_KAFKA_BOOTSTRAP_SERVERS}"
    producer: { value-serializer: org.springframework.kafka.support.serializer.JsonSerializer }
    consumer: { value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer, properties: { spring.json.trusted.packages: "app.unifeed.*" } }
  servlet: { multipart: { max-file-size: 10MB, max-request-size: 10MB } }
  mail: { host: "${MAIL_HOST}", port: "${MAIL_PORT:587}", username: "${MAIL_USERNAME}", password: "${MAIL_PASSWORD}" }
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID}"
            client-secret: "${GOOGLE_CLIENT_SECRET}"
            scope: [openid, profile, email]
app:
  security:
    # DO NOT SET TRUE - see ARCHITECT.md §4
    allow-test-domains: false
    jwt-secret: ${JWT_SIGNING_KEY}
  storage: { uploads-root: "${APP_STORAGE_UPLOADS_ROOT:/app/uploads}", avatar-max-size-bytes: "${APP_STORAGE_AVATAR_MAX_SIZE_BYTES:2097152}", post-media-max-size-bytes: "${APP_STORAGE_POST_MEDIA_MAX_SIZE_BYTES:8388608}", club-cover-max-size-bytes: "${APP_STORAGE_CLUB_COVER_MAX_SIZE_BYTES:5242880}" }
